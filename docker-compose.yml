version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env

  frontend:
    build: ./local-rag-assistant
    ports:
      - "3000:80" # Access the Nginx frontend at localhost:3000
    env_file:
      - ./local-rag-assistant/.env
    depends_on:
      - backend